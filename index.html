<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家空間規劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, precise drafting tool for planning one's own home
   IDEA: an architect's stencil sheet beside a live floor plan, Visio-like but finer
   PICTURE: the plan / 3D room itself, centre stage, with thumbnail stencils on the left
   COLOUR and TYPE: white paper, graphite ink, cobalt selection, warm oak hints; Noto Sans TC
   LAYOUT: stencil library | canvas with floating toolbar + status bar | inspector; stacks on phones */
:root{color-scheme:light dark;--bg:light-dark(#f4f3f0,#121211);--panel:light-dark(#fff,#1b1b19);--soft:light-dark(#f8f7f4,#222220);--ink:light-dark(#1c1b19,#ecebe6);--mut:light-dark(#6c6a63,#a3a199);--line:light-dark(#e3e1da,#34332f);--acc:light-dark(#2453c9,#86a6ff);--accs:light-dark(#e8eefc,#1e2944);--bad:#d2372b;--grid:light-dark(#e6e4de,#272624);--grid2:light-dark(#d6d3cb,#33312e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px max(2vw,14px);border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:21px;line-height:1.1;margin:0}
header p{margin:2px 0 0;color:var(--mut);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:14px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--mut)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{border-color:var(--acc);color:var(--acc);background:var(--accs);font-weight:700}
button:disabled{opacity:.45;cursor:default}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr) 320px;min-height:calc(100vh - 66px)}
aside{background:var(--panel);padding:14px;overflow:auto;max-height:calc(100vh - 66px)}
aside.l{border-right:1px solid var(--line)}aside.r{border-left:1px solid var(--line)}
h2{font-size:13px;margin:18px 0 8px;color:var(--mut);font-weight:500}
h2:first-child{margin-top:0}
.search{position:sticky;top:-14px;background:var(--panel);padding:0 0 10px;z-index:2}
details.grp{border-bottom:1px solid var(--line);padding:4px 0}
details.grp summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:40px;font-weight:500;font-size:14px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"＋";color:var(--mut);font-weight:400}
details.grp[open] summary::after{content:"－"}
details.grp summary small{color:var(--mut);font-weight:400;margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:2px 0 10px}
.tile{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:8px 6px 6px;min-height:0;height:auto;text-align:center;background:var(--soft);border-color:transparent;touch-action:pan-y;user-select:none}
.tile:hover{border-color:var(--acc);background:var(--panel)}
.tile svg{width:100%;height:58px;display:block;pointer-events:none}
.tile b{font-weight:500;font-size:13px;line-height:1.25}
.tile small{color:var(--mut);font-size:11.5px;white-space:nowrap}
.ghost{position:fixed;z-index:50;pointer-events:none;width:90px;height:70px;opacity:.85;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 12px #0003)}
.stage{display:flex;flex-direction:column;padding:12px;gap:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs .sep{flex:1}
.view{position:relative;flex:1;min-height:480px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#plan{position:absolute;inset:0;width:100%;height:calc(100% - 34px);touch-action:none;user-select:none;cursor:default}
#plan.pan{cursor:grabbing}.tabs,.float,#cat,.status{-webkit-user-select:none;user-select:none}#plan.drawing{cursor:crosshair}.hd{cursor:nwse-resize}.wl{cursor:move}
.float{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.float button{min-width:40px;padding:0 10px;background:var(--panel);box-shadow:0 1px 3px #0001}
.status{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);background:var(--soft);font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden}
.status b{color:var(--ink);font-weight:500}
#v3{position:absolute;inset:0;touch-action:none}
#v3 canvas{display:block;width:100%;height:100%}
.ctl3{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ctl3 button{min-width:44px;background:var(--panel)}
.help3{position:absolute;left:10px;bottom:10px;font-size:12.5px;color:var(--mut);background:var(--panel);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.it{cursor:grab}.it:active{cursor:grabbing}
label.f{display:grid;grid-template-columns:5.5em minmax(0,1fr);align-items:center;gap:8px;margin:6px 0;font-size:14px}
input,select{font:inherit;font-size:16px;min-height:40px;width:100%;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=color]{padding:2px;height:40px}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}
.row label{font-size:12.5px;color:var(--mut)}
.styles{display:grid;gap:6px}
.styles button{display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.sw{display:flex;flex:none}.sw i{width:14px;height:22px;display:block}
.sw i:first-child{border-radius:4px 0 0 4px}.sw i:last-child{border-radius:0 4px 4px 0}
.tip{font-size:13px;color:var(--mut);margin:6px 0 0}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mut);margin-right:4px}
.empty{color:var(--mut);font-size:14px;padding:10px;border:1px dashed var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td small{color:var(--mut);display:block;font-size:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.total b{font-size:28px;line-height:1.05;white-space:nowrap}
.unit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.unit label{font-size:12px;color:var(--mut)}
.warn{color:var(--bad);font-size:13px;margin:4px 0 0}
.note{font-size:12px;color:var(--mut);margin-top:8px}
details.more summary{cursor:pointer;font-size:13px;color:var(--mut);margin-top:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(560px,92vw)}
dialog textarea{width:100%;height:220px;font:13px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:1100px){.wrap{grid-template-columns:220px minmax(0,1fr)}aside.r{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 24px}aside.r>section h2:first-child{margin-top:18px}}
@media(max-width:700px){.wrap{grid-template-columns:minmax(0,1fr)}.stage{order:0}aside.l{order:1;border-right:0;border-top:1px solid var(--line);max-height:none}aside.r{order:2}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.view{min-height:64vh}.status .opt{display:none}}
</style>
</head>
<body>
<header>
  <div><h1>居家空間規劃</h1><p>從圖庫拖曳家具到平面圖，切到 3D 鳥瞰或室內漫遊，右側即時估價</p></div>
  <div class="tools">
    <button id="bUndo" title="Ctrl+Z">↶ 復原</button>
    <button id="bIO">匯出／匯入</button>
    <button id="bReset">重設範例</button>
  </div>
</header>
<div class="wrap">
  <aside class="l">
    <div class="search"><input id="q" type="search" placeholder="搜尋：床、燈、窗…" aria-label="搜尋家具"></div>
    <div id="cat"></div>
  </aside>
  <section class="stage">
    <div class="tabs">
      <button id="t2" class="on">2D 平面</button>
      <button id="t3">3D 預覽</button>
      <span class="sep"></span>
      <button id="bRotL" title="逆時針 ([)" disabled>↺</button><button id="bRotR" title="順時針 (R)" disabled>↻</button><button id="bDup" title="Ctrl+D" disabled>複製</button><button id="bDel" title="Delete" disabled>刪除</button>
    </div>
    <div class="view" id="vw2">
      <div class="float"><button id="mSel" class="on">選取</button><button id="mWall" title="快捷鍵 W">畫牆</button><button id="zo2" aria-label="縮小">－</button><button id="zi2" aria-label="放大">＋</button><button id="zf2">適合畫面</button><button id="lyC" class="on">天花物件</button><button id="lyD" class="on">距離標註</button></div>
      <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="status" id="st2"></div>
    </div>
    <div class="view" id="vw3" hidden><div id="v3"></div>
      <div class="help3" id="h3"></div>
      <div class="ctl3"><button id="m3o" class="on">鳥瞰</button><button id="m3t">俯視</button><button id="m3w">室內漫遊</button><button id="zIn" aria-label="放大／前進">＋</button><button id="zOut" aria-label="縮小／後退">－</button></div>
    </div>
  </section>
  <aside class="r">
    <section><h2>選取的物件</h2><div id="props"></div></section>
    <section>
      <h2>房間</h2>
      <div class="row">
        <label>寬 cm<input id="rw" type="number" min="150" max="2000" step="10"></label>
        <label>深 cm<input id="rd" type="number" min="150" max="2000" step="10"></label>
        <label>天花高 cm<input id="rh" type="number" min="200" max="400" step="5"></label>
      </div>
      <p class="tip" id="area"></p>
      <label class="f">地板<select id="floor"></select></label>
      <label class="f">牆色<input id="wall" type="color"></label>
      <label class="f">天花板<select id="ceil"><option value="flat">平頂天花</option><option value="cove">間接照明天花</option><option value="none">不做天花（原樓板）</option></select></label>
      <label class="f">天花色<input id="ceilc" type="color"></label>
    </section>
    <section>
      <h2>風格（套用會改牆色、地板、天花與家具配色）</h2>
      <div class="styles" id="styles"></div>
      <p class="tip" id="stip"></p>
    </section>
    <section>
      <h2>估價</h2>
      <div id="est"></div>
      <div class="unit">
        <label>地板 元/坪<input id="pf" type="number" min="0" step="100"></label>
        <label>天花 元/坪<input id="pc" type="number" min="0" step="100"></label>
        <label>隔間牆 元/坪<input id="pw" type="number" min="0" step="100"></label>
        <label>油漆 元/坪<input id="pp" type="number" min="0" step="50"></label>
        <label>工資雜項 %<input id="pm" type="number" min="0" max="100" step="1"></label>
      </div>
      <p class="note">單價皆為參考值，請依實際報價修改；設計會自動存在這個瀏覽器。</p>
    </section>
  </aside>
</div>
<dialog id="dlg">
  <h2 style="margin-top:0">匯出／匯入設計</h2>
  <p class="tip">複製下方文字即可備份；貼上別的設計再按「載入」。</p>
  <textarea id="io"></textarea>
  <div class="row" style="margin-top:10px"><button id="ioCopy">複製</button><button id="ioLoad">載入</button><button id="ioClose">關閉</button></div>
</dialog>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
